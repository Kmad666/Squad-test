name: Build & deploy to GitHub Pages

# Every push to main runs the tests, re-exports the Godot project for the web
# and publishes it to the gh-pages branch (GitHub Pages), and builds the
# desktop versions (Windows .exe, Linux) into the "desktop-latest" release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-desktop

      - name: Install Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          rm Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -qj Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/web_*' 'templates/version.txt' \
            'templates/windows_*x86_64*' 'templates/linux_*x86_64*' \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Run headless tests (a failure stops the deploy)
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 MINUTES=2 tests/run_all.sh

      - name: Export for web
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p build/web
          $GODOT --headless --import || true
          $GODOT --headless --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web

      - name: Add the modeller (plain web page, served at /modeller/)
        run: |
          cp -r modeller build/web/modeller
          rm -f build/web/modeller/.gdignore

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true

      - name: Export desktop builds (Windows, Linux)
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p build/windows build/linux dist
          $GODOT --headless --export-release "Windows" build/windows/SquadTest.exe
          $GODOT --headless --export-release "Linux" build/linux/SquadTest.x86_64
          cp desktop/SquadTest-LowEnd.bat desktop/README.txt build/windows/
          cp desktop/SquadTest-LowEnd.sh desktop/README.txt build/linux/
          (cd build/windows && zip -qr ../../dist/SquadTest-Windows.zip .)
          (cd build/linux && zip -qr ../../dist/SquadTest-Linux.zip .)
          ls -la dist

      - name: Publish desktop builds (release "desktop-latest")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete desktop-latest -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create desktop-latest dist/SquadTest-Windows.zip dist/SquadTest-Linux.zip \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Desktop build (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Windows: unzip, run SquadTest.exe (unsigned: More info -> Run anyway). Weak GPU: SquadTest-LowEnd.bat. Linux: SquadTest.x86_64 / SquadTest-LowEnd.sh."
